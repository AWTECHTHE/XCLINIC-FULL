version: '3.8'

networks:
  awlicite_network:
    driver: bridge

services:
  nginx:
    image: nginx:latest
    container_name: awlicite_nginx
    ports:
      - "90:90"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - awlicite_api
    networks:
      - awlicite_network
    restart: always

  awlicite_api:
    build: .
    deploy:
      replicas: 3
    env_file:
      - ./config/dev.env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - awlicite_network
    volumes:
      - ./alembic:/app/alembic  # Certifique-se de que este volume está mapeando o diretório alembic corretamente
      - .:/app
      - alembic_data:/app/alembic/versions
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: always

  db:
    image: postgres:13
    container_name: postgres_db  # Matches the hostname in DATABASE_URL
    env_file:
      - ./config/dev.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - awlicite_network
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:6
    container_name: awlicite_redis
    ports:
      - "6380:6379"
    networks:
      - awlicite_network
    volumes:
      - redis_data:/data
    restart: always

volumes:
  pg_data:
  redis_data:
  alembic_data: