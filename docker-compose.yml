version: '3.8'

# Orquestração unificada do XCLINIC: app híbrido (Next.js) + backend (FastAPI) + Postgres + Redis + Nginx.
# Cada serviço usa o Dockerfile do seu próprio subprojeto; nada nos subprojetos precisa mudar.

networks:
  xclinic_network:
    driver: bridge

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: xclinic_nginx
    ports:
      - "90:90"
    volumes:
      - ./xclinic-server-backend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./xclinic-server-backend/logs/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      - xclinic_network
    restart: always

  api:
    build:
      context: ./xclinic-server-backend
    container_name: xclinic_api
    env_file:
      - ./xclinic-server-backend/config/dev.env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - xclinic_network
    volumes:
      - ./xclinic-server-backend/alembic:/app/alembic
      - ./xclinic-server-backend:/app
      - alembic_data:/app/alembic/versions
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: always

  app:
    build:
      context: ./xclinic-hybrid-app
    container_name: xclinic_app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:90}
    depends_on:
      - api
    networks:
      - xclinic_network
    restart: always

  db:
    image: postgres:17-alpine
    container_name: xclinic_postgres
    env_file:
      - ./xclinic-server-backend/config/dev.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - xclinic_network
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:8-alpine
    container_name: xclinic_redis
    ports:
      - "6380:6379"
    networks:
      - xclinic_network
    volumes:
      - redis_data:/data
    restart: always

volumes:
  pg_data:
  redis_data:
  alembic_data:
