version: '3.8'

# NOTE: este é o docker-compose STANDALONE/LEGADO deste subprojeto (nomes de
# serviço "awlicite_*", de antes do XClinic virar monorepo). O compose
# OFICIAL do projeto agora é o docker-compose.yml na raiz do monorepo, que
# orquestra este backend junto com xclinic-hybrid-app. `nginx.conf` (usado
# por ambos) foi corrigido para apontar para o serviço "api" (nome usado no
# compose da raiz) - ou seja, este arquivo standalone está atualmente
# desalinhado com nginx.conf (o upstream "api:8000" não existe aqui, o
# serviço se chama "awlicite_api"). Prefira o compose da raiz; este arquivo
# é candidato a remoção/atualização numa limpeza futura.

networks:
  awlicite_network:
    driver: bridge

services:
  nginx:
    image: nginx:1.29-alpine
    container_name: awlicite_nginx
    ports:
      - "90:90"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - awlicite_api
    networks:
      - awlicite_network
    restart: always

  awlicite_api:
    build: .
    deploy:
      replicas: 3
    env_file:
      - ./config/dev.env
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - awlicite_network
    volumes:
      - ./alembic:/app/alembic  # Certifique-se de que este volume está mapeando o diretório alembic corretamente
      - .:/app
      - alembic_data:/app/alembic/versions
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: always

  db:
    image: postgres:17-alpine
    container_name: postgres_db  # Matches the hostname in DATABASE_URL
    env_file:
      - ./config/dev.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - awlicite_network
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:8-alpine
    container_name: awlicite_redis
    ports:
      - "6380:6379"
    networks:
      - awlicite_network
    volumes:
      - redis_data:/data
    restart: always

volumes:
  pg_data:
  redis_data:
  alembic_data:
