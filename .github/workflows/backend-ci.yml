name: Backend CI (FastAPI)

on:
  push:
    branches:
      - main
      - claude/unify-git-repos-a7eq9e
    paths:
      - 'xclinic-server-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'xclinic-server-backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: xclinic-server-backend

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Aplicar migrações Alembic num Postgres real
        env:
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        run: alembic upgrade head

      - name: Rodar testes (inclui verificação de importação da aplicação)
        env:
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: db
        run: python -m pytest -v
